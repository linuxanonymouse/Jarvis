version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3050:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "4050:4001"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/jarvis
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    ports:
      - "27050:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
